[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhizong"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0"
]

[project.scripts]
zhizong = "zhizong.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/zhizong"]