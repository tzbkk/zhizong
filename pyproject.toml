[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhizong"
version = "0.3.0"
description = "Contract-first corpus validator: validates contract documents against the grammar shipped inside the package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0"
]

[project.scripts]
zhizong = "zhizong.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/zhizong"]